<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCTG System Optimizer Pro — Interactive Demo | PcTechGuyOnline</title>
  <meta name="description" content="Explore every screen in the PCTG System Optimizer Pro demo. Navigation is enabled; product actions remain locked until a paid licence is activated.">
  <meta name="theme-color" content="#A8EA24">
  <!--
    Absolute /demo/ paths on purpose. The page is served at /demo, so a relative
    "styles.css" resolves to /styles.css, which falls through to the landing
    catch-all and 404s - the demo rendered as unstyled default HTML with every
    control dead.
  -->
  <link rel="stylesheet" href="/demo/styles.css">
</head>
<body>

  <!-- DEMO ONLY BANNER -->
  <div class="demo-banner" id="demo-banner">
    <span class="db-dot"></span>
    <strong>DEMO — preview only.</strong>
    <span>Explore the screens. Demo controls are locked; paid functions require a purchased licence in the installed app.</span>
    <button class="db-close" id="db-close" aria-label="Dismiss demo notice">✕</button>
  </div>

  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="PCTG Optimizer Pro home">
        <svg class="brand-art" viewBox="250 320 1010 335" role="img" aria-label="PCTG logo">
          <image href="/assets/pctg-brand-green.png" width="1536" height="1024" />
        </svg>
        <span class="brand-name">OPTIMIZER <strong>PRO</strong></span>
        <span class="brand-tagline">Get YOUR Gamers Edge</span>
        <span class="brand-sub">PcTechGuyOnline · Browser preview</span>
      </a>

      <nav class="side-nav" id="side-nav">
        <button class="nav-item" data-view="dashboard"><span class="ni-icon">🏠</span>Dashboard</button>
        <button class="nav-item" data-view="optimise"><span class="ni-icon">🚀</span>One-Click Optimisation</button>
        <button class="nav-item" data-view="modules"><span class="ni-icon">🧰</span>Toolkit Modules</button>
        <button class="nav-item" data-view="benchmark"><span class="ni-icon">📊</span>Benchmark</button>
        <button class="nav-item" data-view="restore"><span class="ni-icon">↩️</span>Restore Points</button>
        <button class="nav-item" data-view="licences"><span class="ni-icon">🔑</span>Licences</button>
        <button class="nav-item" data-view="settings"><span class="ni-icon">⚙️</span>Settings</button>
      </nav>

      <div class="side-foot">
        <div class="health-chip" id="side-health">Health: 0%</div>
        <a class="side-link" href="/#pricing">Buy the full app &mdash; from &pound;10</a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="top-right">
          <span class="lic-badge" id="lic-badge">Preview only</span>
          <span class="clock" id="clock">--:--:--</span>
        </div>
      </header>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-optimise" hidden></section>
      <section class="view" id="view-modules" hidden></section>
      <section class="view" id="view-benchmark" hidden></section>
      <section class="view" id="view-restore" hidden></section>
      <section class="view" id="view-licences" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>

  <!-- TOAST HOST -->
  <div class="toasts" id="toasts"></div>

  <!-- MODAL HOST -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/demo/app.js"></script>
</body>
</html>
